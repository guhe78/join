<script>//test script nicht final 
  document.addEventListener("DOMContentLoaded", () => {
    const custom = document.querySelector("#assignedSelect");
    if (!custom) return;

    const trigger = custom.querySelector(".select-trigger");
    const dropdown = custom.querySelector(".select-dropdown");
    const textEl = custom.querySelector(".trigger-text");

   
    trigger.addEventListener("click", (e) => {
      e.stopPropagation();
      custom.classList.toggle("open");
    });

   
    document.addEventListener("click", (e) => {
      if (!custom.contains(e.target)) custom.classList.remove("open");
    });

 
    dropdown.addEventListener("click", (e) => {
      const option = e.target.closest(".select-option");
      if (!option) return;

      const cb = option.querySelector('input[type="checkbox"]');
      if (!cb) return;

  
      if (e.target !== cb) cb.checked = !cb.checked;

      
      option.classList.toggle("active", cb.checked);

     
      const checkedCount = dropdown.querySelectorAll('input[type="checkbox"]:checked').length;
      textEl.textContent = checkedCount === 0
        ? "Select contacts to assign"
        : `${checkedCount} selected`;
    });
  });
</script>
